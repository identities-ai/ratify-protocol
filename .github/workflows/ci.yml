name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Every job here checks out and runs tests. None writes to the repository, opens
# issues, or publishes anything, so the token gets read access to contents and
# nothing else. Without this block the token inherits the repository default,
# which may be write. Publishing lives in release.yml and grants its own scopes.
permissions:
  contents: read

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: go mod tidy (must be clean)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  testvector-determinism:
    name: Test vectors regenerate byte-identical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: regenerate fixtures
        run: go run ./cmd/ratify-testvectors -out /tmp/regen

      - name: diff against committed
        run: diff -rq testvectors/v1/ /tmp/regen/

  release-sync:
    name: Release metadata stays in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: check release metadata
        run: ./scripts/check-release-sync.sh

      # A reference README that drifts from the required structure is not a
      # style problem: the sections exist to answer a new reader's questions in
      # the order they ask them. See references/REFERENCE-README-STANDARD.md.
      - name: Reference README structure
        run: python3 scripts/check-reference-readmes.py

      # The structure check counts diagrams and lints the one pitfall it knows.
      # This parses them. A broken diagram is invisible in a diff and renders as
      # "Unable to render rich display" for every reader.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Mermaid diagrams parse
        working-directory: scripts/mermaid-check
        run: |
          npm ci --silent || npm install --silent
          node check.mjs

  typescript:
    name: TypeScript SDK conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: install
        run: npm install --no-audit --no-fund

      - name: typecheck
        run: npx tsc --noEmit

      - name: full test suite (101 tests — conformance + cross-SDK + levers + providers)
        run: npm test

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: install in clean venv (proves pip install works from a cold checkout)
        run: |
          python -m pip install --upgrade pip
          # `-e .[dev]` pulls in cryptography + pqcrypto + pytest via
          # the pyproject.toml dev extras. If this step breaks in a
          # clean runner, the "works from a fresh clone" claim is false.
          pip install -e '.[dev]'

      - name: import check (pqcrypto must be importable)
        run: python -c "from pqcrypto.sign import ml_dsa_65; print('pqcrypto ok')"

      # The pure-Python package must pass without the optional native extra:
      # that is the configuration most users install.
      - name: full test suite (79 fixtures)
        run: pytest -v

      # Then build the optional native extra from source and re-run with it
      # required. RATIFY_REQUIRE_NATIVE=1 turns a missing extension into an
      # error rather than a skip: without it, a job that failed to build the
      # extension would silently skip every deterministic-keygen test and still
      # report success.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: build and install the native extra
        working-directory: sdks/python-native
        run: |
          python -m pip install 'maturin>=1.7,<2'
          maturin build --release --out dist
          pip install dist/*.whl
      - name: test suite with the native extra required
        env:
          RATIFY_REQUIRE_NATIVE: '1'
        run: pytest -v

  # The optional native extra's wheels are built on five platforms at release
  # time. That matrix would otherwise run for the first time during a release,
  # which is the worst moment to discover a manylinux or Windows build problem,
  # so it is exercised here as a dry run whenever the extra changes. Nothing is
  # published; the wheels are built and discarded.
  #
  # Runs on every CI event rather than being paths-filtered: the extra links
  # the Rust core, so a change anywhere in sdks/rust can break these wheels
  # without touching sdks/python-native at all. A path filter would skip the
  # job exactly when the core changed underneath it.
  python-native-wheels:
    name: Python native extra wheels (dry run)
    strategy:
      fail-fast: false
      matrix:
        include:
          # `test` says whether the runner can execute the wheel it just built.
          # A cross-compiled wheel installs nowhere useful on the builder, so
          # those legs prove the build only. Both macOS targets build on the
          # Apple Silicon runner, matching how this repo already builds its C
          # binaries: the Intel `macos-13` label queues indefinitely.
          - { os: ubuntu-latest,  target: x86_64,               py: '3.10', test: true  }
          - { os: ubuntu-latest,  target: aarch64,              py: '3.12', test: false }
          - { os: macos-latest,   target: aarch64-apple-darwin, py: '3.12', test: true  }
          - { os: macos-latest,   target: x86_64-apple-darwin,  py: '3.12', test: false }
          - { os: windows-latest, target: x64,                  py: '3.12', test: true  }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.py }}

      - name: build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
          working-directory: sdks/python-native

      # abi3 is what keeps the matrix to one wheel per platform instead of one
      # per interpreter minor version. If the feature were dropped the wheels
      # would still build, so assert the tag rather than trusting it.
      - name: assert the wheel is abi3
        shell: bash
        working-directory: sdks/python-native
        run: |
          ls -l dist/
          if ! ls dist/*-abi3-*.whl >/dev/null 2>&1; then
            echo "::error::expected an abi3 wheel; the pyo3 abi3-py310 feature may have been dropped"
            exit 1
          fi

      # Cross-compiled wheels cannot be executed on the builder, so only the
      # native-architecture legs prove the wheel actually works. Driven by the
      # matrix's own `test` flag: whether a runner can run what it just built is
      # a property of the leg, not something to re-derive from os and target.
      - name: install and run the suite against the built wheel
        if: matrix.test
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install ./sdks/python-native/dist/*.whl
          pip install -e './sdks/python[dev]'
          cd sdks/python
          RATIFY_REQUIRE_NATIVE=1 pytest -q
  nooa-reference:
    name: NVIDIA NOOA reference (integration required, not skipped)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          # nooa declares requires-python >=3.12,<3.14.
          python-version: '3.12'

      - name: NVIDIA reference gate (authoritative; fails on any skip)
        # One script owns the environment, the pins, and the counts, so CI and a
        # local run cannot drift apart. It sets RATIFY_REQUIRE_NOOA=1 and
        # RATIFY_REQUIRE_MCP=1, so a missing optional dependency is a failure
        # rather than a skip: an ordinary pytest run on 3.11 reported
        # "91 passed, 1 skipped" and exited 0 while the whole MCP module had not
        # run.
        run: ./scripts/nvidia-reference-check.sh

  rust:
    name: Rust SDK conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust

      - name: build
        run: cargo build --all-targets

      # Lint gate: warnings are errors. rustfmt is deliberately NOT gated —
      # the canonical/receipts encoders use a consistent two-statement-per-
      # line style that rustfmt would churn; reformatting the audit-critical
      # serializers is its own decision, not a lint rider.
      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: full test suite (79 fixtures)
        run: cargo test

  c-sdk:
    name: C/C++ SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/c
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/c

      - name: build
        run: cargo build --all-targets

      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: conformance tests (79 fixtures)
        run: cargo test --test conformance -- --nocapture

      - name: unit tests
        run: cargo test --test api

      - name: advanced API tests
        run: cargo test --test advanced

      - name: input-bound boundary tests
        run: cargo test --test bounds

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: check sign-off
        run: |
          # Walk every commit in the PR. Skip merge commits — GitHub
          # auto-creates a synthetic "Merge X into Y" commit for the
          # PR test ref and never asks the author to sign it; requiring
          # DCO on those would fail every PR.
          commits=$(git rev-list --no-merges ${{ github.event.pull_request.base.sha }}..HEAD)
          for c in $commits; do
            msg=$(git log -1 --format=%B "$c")
            if ! echo "$msg" | grep -qE '^Signed-off-by: '; then
              echo "::error::Commit $c missing DCO sign-off (use git commit -s)"
              echo "Commit message:"
              echo "$msg"
              exit 1
            fi
          done
