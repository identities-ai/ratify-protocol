name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: go mod tidy (must be clean)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  testvector-determinism:
    name: Test vectors regenerate byte-identical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: regenerate fixtures
        run: go run ./cmd/ratify-testvectors -out /tmp/regen

      - name: diff against committed
        run: diff -rq testvectors/v1/ /tmp/regen/

  release-sync:
    name: Release metadata stays in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: check release metadata
        run: ./scripts/check-release-sync.sh

  typescript:
    name: TypeScript SDK conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: install
        run: npm install --no-audit --no-fund

      - name: typecheck
        run: npx tsc --noEmit

      - name: full test suite (101 tests — conformance + cross-SDK + levers + providers)
        run: npm test

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: install in clean venv (proves pip install works from a cold checkout)
        run: |
          python -m pip install --upgrade pip
          # `-e .[dev]` pulls in cryptography + pqcrypto + pytest via
          # the pyproject.toml dev extras. If this step breaks in a
          # clean runner, the "works from a fresh clone" claim is false.
          pip install -e '.[dev]'

      - name: import check (pqcrypto must be importable)
        run: python -c "from pqcrypto.sign import ml_dsa_65; print('pqcrypto ok')"

      # The pure-Python package must pass without the optional native extra:
      # that is the configuration most users install.
      - name: full test suite (79 fixtures)
        run: pytest -v

      # Then build the optional native extra from source and re-run with it
      # required. RATIFY_REQUIRE_NATIVE=1 turns a missing extension into an
      # error rather than a skip: without it, a job that failed to build the
      # extension would silently skip every deterministic-keygen test and still
      # report success.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: build and install the native extra
        working-directory: sdks/python-native
        run: |
          python -m pip install 'maturin>=1.7,<2'
          maturin build --release --out dist
          pip install dist/*.whl
      - name: test suite with the native extra required
        env:
          RATIFY_REQUIRE_NATIVE: '1'
        run: pytest -v

  rust:
    name: Rust SDK conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust

      - name: build
        run: cargo build --all-targets

      # Lint gate: warnings are errors. rustfmt is deliberately NOT gated —
      # the canonical/receipts encoders use a consistent two-statement-per-
      # line style that rustfmt would churn; reformatting the audit-critical
      # serializers is its own decision, not a lint rider.
      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: full test suite (79 fixtures)
        run: cargo test

  c-sdk:
    name: C/C++ SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/c
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/c

      - name: build
        run: cargo build --all-targets

      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: conformance tests (79 fixtures)
        run: cargo test --test conformance -- --nocapture

      - name: unit tests
        run: cargo test --test api

      - name: advanced API tests
        run: cargo test --test advanced

      - name: input-bound boundary tests
        run: cargo test --test bounds

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: check sign-off
        run: |
          # Walk every commit in the PR. Skip merge commits — GitHub
          # auto-creates a synthetic "Merge X into Y" commit for the
          # PR test ref and never asks the author to sign it; requiring
          # DCO on those would fail every PR.
          commits=$(git rev-list --no-merges ${{ github.event.pull_request.base.sha }}..HEAD)
          for c in $commits; do
            msg=$(git log -1 --format=%B "$c")
            if ! echo "$msg" | grep -qE '^Signed-off-by: '; then
              echo "::error::Commit $c missing DCO sign-off (use git commit -s)"
              echo "Commit message:"
              echo "$msg"
              exit 1
            fi
          done
