name: Experiment Python Rust accelerator

on:
  push:
    branches: [experiment/python-rust-accelerator]
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -e "sdks/python[dev]" maturin tzdata
      - run: python -m maturin build --release --interpreter python --out native-dist --manifest-path experiments/python-rust-accelerator/native/Cargo.toml
      - run: python -c "import hashlib,pathlib; p=next(pathlib.Path('native-dist').glob('*.whl')); print(hashlib.sha256(p.read_bytes()).hexdigest(), p.name)"
      - run: python -m pip install --no-index --find-links native-dist ratify-python-rust-accelerator
      - run: python -m pytest -q sdks/python/tests
      - run: python -m pytest -q experiments/python-rust-accelerator/test_native.py experiments/python-rust-accelerator/test_accelerator.py
        env:
          PYTHONPATH: experiments/python-rust-accelerator
      - run: python experiments/python-rust-accelerator/benchmark.py
      - run: python experiments/python-rust-accelerator/concurrency.py
