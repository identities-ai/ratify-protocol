name: Experiment TypeScript Rust accelerator

on:
  push:
    branches: [experiment/typescript-rust-accelerator]
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: sdks/typescript
      - run: node --import tsx/esm --test test/*.test.ts
        shell: bash
        working-directory: sdks/typescript
      - run: npm ci
        working-directory: experiments/typescript-rust-accelerator/native
      - run: npx napi build --platform --release
        working-directory: experiments/typescript-rust-accelerator/native
      - run: node -e "const fs=require('fs'),c=require('crypto'); for(const f of fs.readdirSync('.').filter(x=>x.endsWith('.node'))) console.log(c.createHash('sha256').update(fs.readFileSync(f)).digest('hex'),f)"
        working-directory: experiments/typescript-rust-accelerator/native
      - run: node clean-install.cjs
        working-directory: experiments/typescript-rust-accelerator/native
      - run: node --import tsx/esm ../../experiments/typescript-rust-accelerator/check.ts
        working-directory: sdks/typescript
      - run: node --import tsx/esm ../../experiments/typescript-rust-accelerator/event_loop.ts
        working-directory: sdks/typescript
