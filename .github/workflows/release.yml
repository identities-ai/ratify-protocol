name: Release

# The run list is public, so a run says what it is. Without this every entry
# reads "Release", and a rehearsal that stops early is indistinguishable from a
# release that failed. A reader should not have to open a run to tell whether
# anything was published.
run-name: >-
  ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run)
      && format('Dry run {0} — verifies artifacts, publishes nothing', inputs.tag)
      || format('Release {0}', github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name) }}

# Tag-driven publishing. Push a tag matching v* (e.g. v1.0.0-alpha.6) and this
# workflow runs the full CI matrix, then publishes each SDK to its registry
# only if all tests pass. Per-SDK publish steps are conditional and continue
# on individual failure so a partial failure on one registry doesn't block
# the others. See docs/RELEASES.md for the full release process and how to
# recover from partial-publish states.

on:
  push:
    tags:
      - 'v*'
  # Manual trigger for cases where the tag-push didn't fire (e.g. bypassed
  # branch protection). Pass the exact tag to publish, e.g. v1.0.0-alpha.8.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.0-alpha.8)'
        required: true
        type: string
      dry_run:
        description: 'Build and verify artifacts, publish nothing'
        required: false
        default: false
        type: boolean

env:
  # Normalise the ref so both push and workflow_dispatch use the same variable.
  # For push: github.ref_name = "v1.0.0-alpha.8"
  # For workflow_dispatch: inputs.tag = "v1.0.0-alpha.8"
  # Every job checks out refs/tags/$RELEASE_TAG, never the workflow ref, and
  # then proves HEAD is the commit the tag points to on origin. A manual run
  # started from a branch therefore builds, tests, and publishes the tagged
  # tree, not the branch head.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Gate: every CI check must pass before any publish job runs. We re-run the
  # tests here rather than depending on the CI workflow because tag pushes are
  # the moment of truth — fresh runner, fresh checkout, no inherited state.
  # ──────────────────────────────────────────────────────────────────────────
  gate-tests:
    name: Gate — all tests must pass
    runs-on: ubuntu-latest
    outputs:
      line: ${{ steps.line.outputs.line }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: verify checkout is the release tag commit
        shell: bash
        run: |
          set -euo pipefail
          refs=$(git ls-remote --tags origin)
          want=$(awk -v r="refs/tags/${RELEASE_TAG}^{}" '$2 == r { print $1 }' <<<"$refs")
          [ -n "$want" ] || want=$(awk -v r="refs/tags/${RELEASE_TAG}" '$2 == r { print $1 }' <<<"$refs")
          got=$(git rev-parse HEAD)
          if [ -z "$want" ] || [ "$got" != "$want" ]; then
            echo "::error::checked out $got but tag $RELEASE_TAG points to ${want:-nothing}"
            exit 1
          fi
          echo "checked out $got = $RELEASE_TAG"

      # This tree carries two release lines. A v2.* tag releases the v2 line
      # (TypeScript, Rust, C, Go module /v2, ratify-protocol-v2 and its native
      # extra). A v1.* tag releases the v1 line (ratify-protocol and its native
      # extra, plus the other SDKs only if they are also at that version).
      # Publish jobs read this output so one tag never publishes the other
      # line's packages.
      - name: release line
        id: line
        run: |
          case "$RELEASE_TAG" in
            v1.*) echo "line=v1" >> "$GITHUB_OUTPUT" ;;
            v2.*) echo "line=v2" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::tag $RELEASE_TAG is on neither the v1 nor the v2 line"; exit 1 ;;
          esac

      # Go
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: go mod tidy must be clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # Testvector determinism — proves fixtures regenerate byte-identical
      - name: regenerate fixtures
        run: go run ./cmd/ratify-testvectors -out /tmp/regen
      - name: diff fixtures
        run: diff -rq testvectors/v1/ /tmp/regen/

      # Release metadata sync — every SDK version + lock matches
      - name: release-sync
        run: ./scripts/check-release-sync.sh

      # TypeScript
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: sdks/typescript/package-lock.json
      - name: TS install
        working-directory: sdks/typescript
        run: npm install --no-audit --no-fund
      - name: TS typecheck
        working-directory: sdks/typescript
        run: npx tsc --noEmit
      - name: TS full test suite
        working-directory: sdks/typescript
        run: npm test

      # Python
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python install
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Python full test suite
        working-directory: sdks/python
        run: pytest -v

      # The pure-Python run above intentionally skips the three deterministic
      # seed tests because they require the optional native extension. Build
      # that extension in the release gate too, so a release cannot pass while
      # the native path is absent or incompatible. One non-native-only test is
      # expected to skip in this configuration; RATIFY_REQUIRE_NATIVE makes
      # every native-required test fail instead of silently skipping.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Build and install the native Python extra
        working-directory: sdks/python-native
        run: |
          python -m pip install 'maturin>=1.7,<2'
          maturin build --release --out dist
          pip install dist/*.whl
      - name: Python native-extra test suite
        working-directory: sdks/python
        env:
          RATIFY_REQUIRE_NATIVE: '1'
        run: pytest -v

      # Python v2 (ratify-protocol-v2). Signing is native-only and the native
      # extension is a required, exactly pinned dependency, so it is built and
      # installed first and the SDK suite runs with it required.
      - name: Build and install the v2 native Python extension
        working-directory: sdks/python-native-v2
        run: |
          maturin build --release --out dist
          pip install dist/*.whl
      - name: Python v2 install
        working-directory: sdks/python-v2
        run: pip install -e '.[dev]'
      - name: Python v2 full test suite (native required)
        working-directory: sdks/python-v2
        env:
          RATIFY_REQUIRE_NATIVE: '1'
        run: pytest -v

      # Rust
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust
      - name: Rust build
        working-directory: sdks/rust
        run: cargo build --all-targets --release
      - name: Rust conformance (all canonical fixtures)
        working-directory: sdks/rust
        run: cargo test --release

      # C / C++
      - name: C/C++ build
        working-directory: sdks/c
        run: cargo build --all-targets
      - name: C/C++ conformance (all canonical fixtures)
        working-directory: sdks/c
        run: cargo test --test conformance -- --nocapture
      - name: C/C++ API tests
        working-directory: sdks/c
        run: cargo test --test api
      - name: C/C++ advanced API tests
        working-directory: sdks/c
        run: cargo test --test advanced
      - name: C/C++ v2 ABI tests (testvectors/v2)
        working-directory: sdks/c
        run: cargo test --test v2_abi
      - name: C v2 ABI smoke test (system C compiler, testvectors/v2)
        run: ./sdks/c/scripts/test-v2-c-abi.sh

      # Tag ↔ SDK version coherence: the pushed tag must match every SDK's
      # declared version. The release-sync script already proves alignment
      # within each line; here we prove the tag matches that line's version.
      # A v2 tag checks the v2 packages and the v2 Python distributions. A v1
      # tag checks the v1 Python packages and every other SDK, so it fails
      # while those SDKs are on the v2 line rather than releasing them under a
      # v1 tag.
      - name: tag matches SDK versions
        env:
          LINE: ${{ steps.line.outputs.line }}
        run: |
          set -eu
          tag="$RELEASE_TAG"          # e.g. v2.0.0-alpha.1
          tag_clean="${tag#v}"                     # 2.0.0-alpha.1
          ver() { grep -E '^version = "' "$1" | head -1 | sed -E 's/.*"(.*)".*/\1/'; }
          rust_version=$(ver sdks/rust/Cargo.toml)
          c_version=$(ver sdks/c/Cargo.toml)
          ts_version=$(node -p "require('./sdks/typescript/package.json').version")
          # Python uses PEP 440 form (2.0.0a1) — accept either form.
          py_clean_from_tag=$(echo "$tag_clean" | sed -E 's/-alpha\.([0-9]+)/a\1/; s/-beta\.([0-9]+)/b\1/; s/-rc\.([0-9]+)/rc\1/')
          [ "$rust_version" = "$tag_clean" ] || { echo "::error::tag $tag_clean ≠ rust $rust_version"; exit 1; }
          [ "$c_version"    = "$tag_clean" ] || { echo "::error::tag $tag_clean ≠ c $c_version"; exit 1; }
          [ "$ts_version"   = "$tag_clean" ] || { echo "::error::tag $tag_clean ≠ ts $ts_version"; exit 1; }
          if [ "$LINE" = "v2" ]; then
            go_module=$(go list -m)
            pyv2_version=$(ver sdks/python-v2/pyproject.toml)
            native_v2_version=$(ver sdks/python-native-v2/Cargo.toml)
            [ "$go_module" = "github.com/identities-ai/ratify-protocol/v2" ] || { echo "::error::v2 tag but Go module is $go_module"; exit 1; }
            [ "$pyv2_version" = "$py_clean_from_tag" ] || { echo "::error::tag pep440 $py_clean_from_tag ≠ python-v2 $pyv2_version"; exit 1; }
            [ "$native_v2_version" = "$tag_clean" ] || { echo "::error::tag $tag_clean ≠ python-native-v2 $native_v2_version"; exit 1; }
          else
            py_version=$(ver sdks/python/pyproject.toml)
            native_version=$(ver sdks/python-native/Cargo.toml)
            [ "$py_version" = "$py_clean_from_tag" ] || { echo "::error::tag pep440 $py_clean_from_tag ≠ py $py_version"; exit 1; }
            [ "$native_version" = "$tag_clean" ] || { echo "::error::tag $tag_clean ≠ python-native $native_version"; exit 1; }
          fi
          echo "✓ tag $tag matches all $LINE SDK versions"

  # ──────────────────────────────────────────────────────────────────────────
  # PyPI — Trusted Publisher (OIDC). No long-lived secret. Requires that the
  # 'pypi-publish' environment exist on the repo and that PyPI is configured
  # with this repo + workflow as a trusted publisher for the project. See
  # docs/REGISTRY_SETUP.md for the one-time PyPI UI steps.
  # ──────────────────────────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && needs.gate-tests.outputs.line == 'v1' }}
    needs: gate-tests
    runs-on: ubuntu-latest
    environment:
      name: pypi-publish
      url: https://pypi.org/project/ratify-protocol/
    permissions:
      id-token: write  # required for OIDC exchange with PyPI
      contents: read   # required by actions/checkout to read the repo
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: verify checkout is the release tag commit
        shell: bash
        run: |
          set -euo pipefail
          refs=$(git ls-remote --tags origin)
          want=$(awk -v r="refs/tags/${RELEASE_TAG}^{}" '$2 == r { print $1 }' <<<"$refs")
          [ -n "$want" ] || want=$(awk -v r="refs/tags/${RELEASE_TAG}" '$2 == r { print $1 }' <<<"$refs")
          got=$(git rev-parse HEAD)
          if [ -z "$want" ] || [ "$got" != "$want" ]; then
            echo "::error::checked out $got but tag $RELEASE_TAG points to ${want:-nothing}"
            exit 1
          fi
          echo "checked out $got = $RELEASE_TAG"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: build sdist + wheel
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -lh dist/
      # ratify-protocol stays pure-Python, so this remains a single
      # py3-none-any wheel that installs on every platform. The optional
      # native extra is a separate distribution with its own job below.
      - name: assert the wheel is platform-independent
        working-directory: sdks/python
        run: |
          if ! ls dist/*-py3-none-any.whl >/dev/null 2>&1; then
            echo "::error::ratify-protocol must publish a py3-none-any wheel."
            echo "A platform-specific wheel here means the package stopped"
            echo "being pure-Python and would no longer install everywhere."
            ls -l dist/
            exit 1
          fi
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
          # Skip-existing tolerates the same-version re-run case (e.g.
          # workflow re-triggered after a partial failure). PyPI rejects
          # actual version conflicts independently.
          skip-existing: true

  # ──────────────────────────────────────────────────────────────────────────
  # crates.io — token-based (cargo doesn't yet support OIDC). Token stored as
  # a repo secret. Token should be scoped to publish-update for the
  # 'ratify-protocol' crate; see docs/REGISTRY_SETUP.md.
  # ──────────────────────────────────────────────────────────────────────────
  # ──────────────────────────────────────────────────────────────────────────
  # The optional native extra. A separate distribution so that
  # `ratify-protocol` itself stays pure-Python and installs anywhere, including
  # platforms this job has no wheel for.
  #
  # abi3-py310 means one wheel per platform covers every CPython from 3.10 up,
  # rather than one per interpreter minor version.
  # ──────────────────────────────────────────────────────────────────────────
  # Builds wheels only. Deliberately carries neither the pypi-publish
  # environment nor id-token: write — it never talks to PyPI, and attaching the
  # environment here would make all five matrix legs wait on the environment's
  # manual approval before they could even compile. Approval belongs on the one
  # job that actually uploads.
  build-pypi-native:
    name: Build native extra wheels
    needs: gate-tests
    if: needs.gate-tests.outputs.line == 'v1'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS targets build on the Apple Silicon runner, matching how
          # this repo already builds its C binaries. The Intel `macos-13` label
          # queues indefinitely, so depending on it would stall every release.
          - { os: ubuntu-latest,  target: x86_64,               manylinux: auto }
          - { os: ubuntu-latest,  target: aarch64,              manylinux: auto }
          - { os: macos-latest,   target: aarch64-apple-darwin, manylinux: auto }
          - { os: macos-latest,   target: x86_64-apple-darwin,  manylinux: auto }
          - { os: windows-latest, target: x64,                  manylinux: auto }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: verify checkout is the release tag commit
        shell: bash
        run: |
          set -euo pipefail
          refs=$(git ls-remote --tags origin)
          want=$(awk -v r="refs/tags/${RELEASE_TAG}^{}" '$2 == r { print $1 }' <<<"$refs")
          [ -n "$want" ] || want=$(awk -v r="refs/tags/${RELEASE_TAG}" '$2 == r { print $1 }' <<<"$refs")
          got=$(git rev-parse HEAD)
          if [ -z "$want" ] || [ "$got" != "$want" ]; then
            echo "::error::checked out $got but tag $RELEASE_TAG points to ${want:-nothing}"
            exit 1
          fi
          echo "checked out $got = $RELEASE_TAG"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          working-directory: sdks/python-native
      - uses: actions/upload-artifact@v7
        with:
          name: native-wheels-${{ matrix.os }}-${{ matrix.target }}
          path: sdks/python-native/dist

  # Assembles exactly what the upload would receive and checks it, in a job that
  # binds no environment and holds no credential, so it runs on a dry run
  # without waiting for an approval that protects an upload it will not perform.
  #
  # This is the job a dry run exists for. Five matrix legs upload separately
  # named artifacts and merge-multiple flattens them here, and until now nothing
  # checked the result except a release doing it for real.
  verify-pypi-native:
    name: Verify the native wheel set
    needs: build-pypi-native
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: verify checkout is the release tag commit
        shell: bash
        run: |
          set -euo pipefail
          refs=$(git ls-remote --tags origin)
          want=$(awk -v r="refs/tags/${RELEASE_TAG}^{}" '$2 == r { print $1 }' <<<"$refs")
          [ -n "$want" ] || want=$(awk -v r="refs/tags/${RELEASE_TAG}" '$2 == r { print $1 }' <<<"$refs")
          got=$(git rev-parse HEAD)
          if [ -z "$want" ] || [ "$got" != "$want" ]; then
            echo "::error::checked out $got but tag $RELEASE_TAG points to ${want:-nothing}"
            exit 1
          fi
          echo "checked out $got = $RELEASE_TAG"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: native-wheels-*
          merge-multiple: true
          path: dist
      # The sdist is built once, separately: a source install of the extra does
      # require a Rust toolchain, which is documented in its README.
      - name: build sdist
        working-directory: sdks/python-native
        run: |
          python -m pip install 'maturin>=1.7,<2'
          maturin sdist --out ../../dist
      # The upload runs with skip-existing, so a partial set publishes
      # successfully and says nothing. The set is asserted rather than inferred
      # from a green job.
      - name: the merged artifact set must be complete and flat
        run: |
          set -euo pipefail
          echo "dist/ contains:"; ls -la dist/
          wheels=$(find dist -maxdepth 1 -name '*.whl' | wc -l | tr -d ' ')
          sdists=$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')
          nested=$(find dist -mindepth 2 | wc -l | tr -d ' ')
          test "$wheels" = "5" || { echo "::error::expected 5 wheels, found $wheels; merge-multiple did not flatten every matrix leg"; exit 1; }
          test "$sdists" = "1" || { echo "::error::expected 1 sdist, found $sdists"; exit 1; }
          test "$nested" = "0" || { echo "::error::dist/ has nested paths; merge-multiple left artifacts in per-name directories"; exit 1; }
          for tag in manylinux_2_17_x86_64 manylinux_2_17_aarch64 macosx_.*arm64 macosx_.*x86_64 win_amd64; do
            find dist -maxdepth 1 -name '*.whl' | grep -qE "$tag" || { echo "::error::no wheel matching platform tag $tag"; exit 1; }
          done
          echo "5 wheels, 1 sdist, flat, every platform present"

  publish-pypi-native:
    name: Publish native extra to PyPI
    # Skipped entirely on a dry run, rather than run with its upload disabled:
    # a job that does not start cannot upload by accident, and it binds no
    # environment and requests no token.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    needs: verify-pypi-native
    runs-on: ubuntu-latest
    environment:
      name: pypi-publish
      url: https://pypi.org/project/ratify-protocol-native/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: verify checkout is the release tag commit
        shell: bash
        run: |
          set -euo pipefail
          refs=$(git ls-remote --tags origin)
          want=$(awk -v r="refs/tags/${RELEASE_TAG}^{}" '$2 == r { print $1 }' <<<"$refs")
          [ -n "$want" ] || want=$(awk -v r="refs/tags/${RELEASE_TAG}" '$2 == r { print $1 }' <<<"$refs")
          got=$(git rev-parse HEAD)
          if [ -z "$want" ] || [ "$got" != "$want" ]; then
            echo "::error::checked out $got but tag $RELEASE_TAG points to ${want:-nothing}"
            exit 1
          fi
          echo "checked out $got = $RELEASE_TAG"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: native-wheels-*
          merge-multiple: true
          path: dist
      # The sdist is built once, separately: a source install of the extra does
      # require a Rust toolchain, which is documented in its README.
      - name: build sdist
        working-directory: sdks/python-native
        run: |
          python -m pip install 'maturin>=1.7,<2'
          maturin sdist --out ../../dist
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  # ──────────────────────────────────────────────────────────────────────────
  # Python v2: ratify-protocol-v2 and its native extra ratify-protocol-native-v2.
  # These mirror the v1 Python jobs above and run only for v2 tags. They are
  # separate distributions, so the v1 `ratify-protocol` package and its
  # existing pins are never touched by a v2 release. The PyPI trusted
  # publisher for both project names must be configured before the first v2
  # release; see docs/REGISTRY_SETUP.md.
  # ──────────────────────────────────────────────────────────────────────────
  publish-pypi-v2:
    name: Publish v2 Python SDK to PyPI
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && needs.gate-tests.outputs.line == 'v2' }}
    # ratify-protocol-v2 pins ratify-protocol-native-v2 exactly, so the native
    # package must be on PyPI first or the SDK is uninstallable.
    needs: [gate-tests, publish-pypi-native-v2]
    runs-on: ubuntu-latest
    environment:
      name: pypi-publish
      url: https://pypi.org/project/ratify-protocol-v2/
    permissions:
      id-token: write  # required for OIDC exchange with PyPI
      contents: read   # required by actions/checkout to read the repo
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: verify checkout is the release tag commit
        shell: bash
        run: |
          set -euo pipefail
          refs=$(git ls-remote --tags origin)
          want=$(awk -v r="refs/tags/${RELEASE_TAG}^{}" '$2 == r { print $1 }' <<<"$refs")
          [ -n "$want" ] || want=$(awk -v r="refs/tags/${RELEASE_TAG}" '$2 == r { print $1 }' <<<"$refs")
          got=$(git rev-parse HEAD)
          if [ -z "$want" ] || [ "$got" != "$want" ]; then
            echo "::error::checked out $got but tag $RELEASE_TAG points to ${want:-nothing}"
            exit 1
          fi
          echo "checked out $got = $RELEASE_TAG"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: build sdist + wheel
        working-directory: sdks/python-v2
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -lh dist/
      - name: assert the wheel is platform-independent
        working-directory: sdks/python-v2
        run: |
          if ! ls dist/*-py3-none-any.whl >/dev/null 2>&1; then
            echo "::error::ratify-protocol-v2 must publish a py3-none-any wheel."
            ls -l dist/
            exit 1
          fi
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python-v2/dist
          skip-existing: true

  # Builds wheels only; no environment and no id-token, for the same reason as
  # build-pypi-native.
  build-pypi-native-v2:
    name: Build v2 native extra wheels
    needs: gate-tests
    if: needs.gate-tests.outputs.line == 'v2'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64,               manylinux: auto }
          - { os: ubuntu-latest,  target: aarch64,              manylinux: auto }
          - { os: macos-latest,   target: aarch64-apple-darwin, manylinux: auto }
          - { os: macos-latest,   target: x86_64-apple-darwin,  manylinux: auto }
          - { os: windows-latest, target: x64,                  manylinux: auto }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: verify checkout is the release tag commit
        shell: bash
        run: |
          set -euo pipefail
          refs=$(git ls-remote --tags origin)
          want=$(awk -v r="refs/tags/${RELEASE_TAG}^{}" '$2 == r { print $1 }' <<<"$refs")
          [ -n "$want" ] || want=$(awk -v r="refs/tags/${RELEASE_TAG}" '$2 == r { print $1 }' <<<"$refs")
          got=$(git rev-parse HEAD)
          if [ -z "$want" ] || [ "$got" != "$want" ]; then
            echo "::error::checked out $got but tag $RELEASE_TAG points to ${want:-nothing}"
            exit 1
          fi
          echo "checked out $got = $RELEASE_TAG"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          working-directory: sdks/python-native-v2
      # The artifact prefix differs from the v1 job's so neither download
      # pattern can pick up the other line's wheels.
      - uses: actions/upload-artifact@v7
        with:
          name: native-v2-wheels-${{ matrix.os }}-${{ matrix.target }}
          path: sdks/python-native-v2/dist

  verify-pypi-native-v2:
    name: Verify the v2 native wheel set
    needs: build-pypi-native-v2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: verify checkout is the release tag commit
        shell: bash
        run: |
          set -euo pipefail
          refs=$(git ls-remote --tags origin)
          want=$(awk -v r="refs/tags/${RELEASE_TAG}^{}" '$2 == r { print $1 }' <<<"$refs")
          [ -n "$want" ] || want=$(awk -v r="refs/tags/${RELEASE_TAG}" '$2 == r { print $1 }' <<<"$refs")
          got=$(git rev-parse HEAD)
          if [ -z "$want" ] || [ "$got" != "$want" ]; then
            echo "::error::checked out $got but tag $RELEASE_TAG points to ${want:-nothing}"
            exit 1
          fi
          echo "checked out $got = $RELEASE_TAG"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: native-v2-wheels-*
          merge-multiple: true
          path: dist
      - name: build sdist
        working-directory: sdks/python-native-v2
        run: |
          python -m pip install 'maturin>=1.7,<2'
          maturin sdist --out ../../dist
      - name: the merged artifact set must be complete and flat
        run: |
          set -euo pipefail
          echo "dist/ contains:"; ls -la dist/
          wheels=$(find dist -maxdepth 1 -name '*.whl' | wc -l | tr -d ' ')
          sdists=$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')
          nested=$(find dist -mindepth 2 | wc -l | tr -d ' ')
          test "$wheels" = "5" || { echo "::error::expected 5 wheels, found $wheels; merge-multiple did not flatten every matrix leg"; exit 1; }
          test "$sdists" = "1" || { echo "::error::expected 1 sdist, found $sdists"; exit 1; }
          test "$nested" = "0" || { echo "::error::dist/ has nested paths; merge-multiple left artifacts in per-name directories"; exit 1; }
          for tag in manylinux_2_17_x86_64 manylinux_2_17_aarch64 macosx_.*arm64 macosx_.*x86_64 win_amd64; do
            find dist -maxdepth 1 -name '*.whl' | grep -qE "$tag" || { echo "::error::no wheel matching platform tag $tag"; exit 1; }
          done
          echo "5 wheels, 1 sdist, flat, every platform present"

  publish-pypi-native-v2:
    name: Publish v2 native extra to PyPI
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    needs: verify-pypi-native-v2
    runs-on: ubuntu-latest
    environment:
      name: pypi-publish
      url: https://pypi.org/project/ratify-protocol-native-v2/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: verify checkout is the release tag commit
        shell: bash
        run: |
          set -euo pipefail
          refs=$(git ls-remote --tags origin)
          want=$(awk -v r="refs/tags/${RELEASE_TAG}^{}" '$2 == r { print $1 }' <<<"$refs")
          [ -n "$want" ] || want=$(awk -v r="refs/tags/${RELEASE_TAG}" '$2 == r { print $1 }' <<<"$refs")
          got=$(git rev-parse HEAD)
          if [ -z "$want" ] || [ "$got" != "$want" ]; then
            echo "::error::checked out $got but tag $RELEASE_TAG points to ${want:-nothing}"
            exit 1
          fi
          echo "checked out $got = $RELEASE_TAG"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: native-v2-wheels-*
          merge-multiple: true
          path: dist
      - name: build sdist
        working-directory: sdks/python-native-v2
        run: |
          python -m pip install 'maturin>=1.7,<2'
          maturin sdist --out ../../dist
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  publish-crates:
    name: Publish to crates.io
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    needs: gate-tests
    runs-on: ubuntu-latest
    environment:
      name: crates-publish
      url: https://crates.io/crates/ratify-protocol
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: verify checkout is the release tag commit
        shell: bash
        run: |
          set -euo pipefail
          refs=$(git ls-remote --tags origin)
          want=$(awk -v r="refs/tags/${RELEASE_TAG}^{}" '$2 == r { print $1 }' <<<"$refs")
          [ -n "$want" ] || want=$(awk -v r="refs/tags/${RELEASE_TAG}" '$2 == r { print $1 }' <<<"$refs")
          got=$(git rev-parse HEAD)
          if [ -z "$want" ] || [ "$got" != "$want" ]; then
            echo "::error::checked out $got but tag $RELEASE_TAG points to ${want:-nothing}"
            exit 1
          fi
          echo "checked out $got = $RELEASE_TAG"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust
      - name: cargo publish (dry-run sanity)
        working-directory: sdks/rust
        run: cargo publish --dry-run
      # Same-version re-runs must not block the release, but cargo exits 101
      # for EVERY error — matching on the exit code masked a real 403
      # (token lacking permission for the crate) as "already published" at
      # v1.0.0-alpha.13. Tolerate only the actual already-exists message;
      # fail loud on everything else.
      - name: cargo publish
        working-directory: sdks/rust
        run: |
          set -o pipefail
          out=$(cargo publish --token "$CARGO_REGISTRY_TOKEN" 2>&1) && { echo "$out"; exit 0; }
          echo "$out"
          if echo "$out" | grep -qiE "already (exists|uploaded)"; then
            echo "already published — ok"
          else
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # ratify-c depends on ratify-protocol via a local path; crates.io
      # requires the dependency to be indexed before the dependent can
      # publish. Wait for indexing, then publish the C crate. This step was
      # missing entirely — ratify-c froze at alpha.8 on crates.io when
      # publishing moved from the manual flow to CI.
      - name: wait for ratify-protocol to be indexed
        run: sleep 60
      - name: cargo publish (ratify-c)
        working-directory: sdks/c
        run: |
          set -o pipefail
          out=$(cargo publish --token "$CARGO_REGISTRY_TOKEN" 2>&1) && { echo "$out"; exit 0; }
          echo "$out"
          if echo "$out" | grep -qiE "already (exists|uploaded)"; then
            echo "already published — ok"
          else
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # npm — Trusted Publisher (OIDC). No long-lived secret. The npm package is
  # configured with this repo + workflow as a trusted publisher; authentication
  # is handled via the OIDC token exchange, not NPM_TOKEN. The NPM_PUBLISH_ENABLED
  # variable acts as an emergency off-switch if needed.
  # ──────────────────────────────────────────────────────────────────────────
  publish-npm:
    name: Publish to npm
    needs: gate-tests
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && vars.NPM_PUBLISH_ENABLED == 'true' }}
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@identities-ai/ratify-protocol
    permissions:
      contents: read
      id-token: write  # required for OIDC exchange with npm Trusted Publisher
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: verify checkout is the release tag commit
        shell: bash
        run: |
          set -euo pipefail
          refs=$(git ls-remote --tags origin)
          want=$(awk -v r="refs/tags/${RELEASE_TAG}^{}" '$2 == r { print $1 }' <<<"$refs")
          [ -n "$want" ] || want=$(awk -v r="refs/tags/${RELEASE_TAG}" '$2 == r { print $1 }' <<<"$refs")
          got=$(git rev-parse HEAD)
          if [ -z "$want" ] || [ "$got" != "$want" ]; then
            echo "::error::checked out $got but tag $RELEASE_TAG points to ${want:-nothing}"
            exit 1
          fi
          echo "checked out $got = $RELEASE_TAG"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: sdks/typescript/package-lock.json
          # No registry-url here — that would write a token-based .npmrc entry
          # that conflicts with OIDC Automated Publishing. The OIDC token from
          # id-token: write is exchanged directly by npm publish --provenance.
      - name: install
        working-directory: sdks/typescript
        run: npm install --no-audit --no-fund
      - name: build
        working-directory: sdks/typescript
        run: npm run build
      - name: publish (with provenance)
        working-directory: sdks/typescript
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Skip gracefully if this version is already published (re-run safety).
          # The normal publish path uses --tag latest, so if we're skipping an
          # already-published version, latest was already set correctly.
          if npm view "@identities-ai/ratify-protocol@${VERSION}" version 2>/dev/null | grep -qF "$VERSION"; then
            echo "Version ${VERSION} already published — skipping."
            exit 0
          fi
          # v1 versions publish with --tag latest so
          # 'npm install @identities-ai/ratify-protocol' resolves to the newest
          # v1 release. v2 prereleases (2.x.y-alpha/beta/rc) publish under the
          # next dist-tag (matching publishConfig.tag) so they never become
          # latest by accident and an unpinned install keeps resolving to v1
          # until 2.0.0.
          case "$VERSION" in
            2.*-*) DIST_TAG=next ;;
            *)     DIST_TAG=latest ;;
          esac
          npm publish --access public --provenance --tag "$DIST_TAG"

  # ──────────────────────────────────────────────────────────────────────────
  # Go: nothing to do. Tag push + pkg.go.dev auto-discovery handle it.
  # This job exists as a tracking marker in the workflow graph so the
  # release summary tells you Go is "ready" rather than "missing".
  # ──────────────────────────────────────────────────────────────────────────
  publish-go:
    name: Publish Go (auto via pkg.go.dev)
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    needs: gate-tests
    runs-on: ubuntu-latest
    steps:
      - name: trigger pkg.go.dev index refresh
        # Fetching the module against the new tag is the documented way to
        # prompt pkg.go.dev to index the version sooner. Failures here are
        # non-fatal — pkg.go.dev will pick it up eventually either way.
        continue-on-error: true
        # v2+ tags live under the /v2 module path (Go semantic import
        # versioning); the bare path only resolves v0/v1 tags.
        run: |
          tag="$RELEASE_TAG"
          case "$tag" in
            v2.*) module="github.com/identities-ai/ratify-protocol/v2" ;;
            *)    module="github.com/identities-ai/ratify-protocol" ;;
          esac
          curl -fsSL "https://proxy.golang.org/${module}/@v/${tag}.info" || true

  # ──────────────────────────────────────────────────────────────────────────
  # Pre-built C/C++ libraries — cross-compile for common targets and upload
  # as artifacts so github-release can attach them. Consumers can link
  # against libratify_c.a without installing the Rust toolchain.
  # ──────────────────────────────────────────────────────────────────────────
  build-c-binaries:
    name: C/C++ library (${{ matrix.archive }})
    needs: [gate-tests]
    if: needs.gate-tests.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,      os: ubuntu-latest,  cross: false, archive: linux-x86_64   }
          - { target: aarch64-unknown-linux-gnu,     os: ubuntu-latest,  cross: true,  archive: linux-aarch64  }
          - { target: armv7-unknown-linux-gnueabihf, os: ubuntu-latest,  cross: true,  archive: linux-armv7    }
          - { target: x86_64-apple-darwin,           os: macos-latest,   cross: false, archive: macos-x86_64   }
          - { target: aarch64-apple-darwin,          os: macos-latest,   cross: false, archive: macos-aarch64  }
          - { target: x86_64-pc-windows-msvc,        os: windows-latest, cross: false, archive: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: verify checkout is the release tag commit
        shell: bash
        run: |
          set -euo pipefail
          refs=$(git ls-remote --tags origin)
          want=$(awk -v r="refs/tags/${RELEASE_TAG}^{}" '$2 == r { print $1 }' <<<"$refs")
          [ -n "$want" ] || want=$(awk -v r="refs/tags/${RELEASE_TAG}" '$2 == r { print $1 }' <<<"$refs")
          got=$(git rev-parse HEAD)
          if [ -z "$want" ] || [ "$got" != "$want" ]; then
            echo "::error::checked out $got but tag $RELEASE_TAG points to ${want:-nothing}"
            exit 1
          fi
          echo "checked out $got = $RELEASE_TAG"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build
        working-directory: sdks/c
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Package
        working-directory: sdks/c
        shell: bash
        env:
          ARCHIVE_NAME: ratify-c-${{ env.RELEASE_TAG }}-${{ matrix.archive }}
        run: |
          mkdir -p "dist/${ARCHIVE_NAME}/lib" "dist/${ARCHIVE_NAME}/include"
          cp include/ratify.h "dist/${ARCHIVE_NAME}/include/"
          target_dir="target/${{ matrix.target }}/release"
          for ext in a so dylib dll lib; do
            [ -f "${target_dir}/libratify_c.${ext}" ] && cp "${target_dir}/libratify_c.${ext}" "dist/${ARCHIVE_NAME}/lib/" || true
            [ -f "${target_dir}/ratify_c.${ext}" ]    && cp "${target_dir}/ratify_c.${ext}"    "dist/${ARCHIVE_NAME}/lib/" || true
          done
          cd dist
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}/"
            echo "ARCHIVE_FILE=${ARCHIVE_NAME}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}/"
            echo "ARCHIVE_FILE=${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: c-lib-${{ matrix.archive }}
          path: sdks/c/dist/${{ env.ARCHIVE_FILE }}
          retention-days: 1

  # GitHub Release — last so it only appears once registry publishes have
  # been attempted. Attaches the testvectors/v1 bundle and pre-built C
  # libraries as release assets.
  # ──────────────────────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: [gate-tests, publish-pypi, publish-pypi-native, publish-pypi-v2, publish-pypi-native-v2, publish-crates, publish-npm, publish-go, build-c-binaries]
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && needs.gate-tests.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: verify checkout is the release tag commit
        shell: bash
        run: |
          set -euo pipefail
          refs=$(git ls-remote --tags origin)
          want=$(awk -v r="refs/tags/${RELEASE_TAG}^{}" '$2 == r { print $1 }' <<<"$refs")
          [ -n "$want" ] || want=$(awk -v r="refs/tags/${RELEASE_TAG}" '$2 == r { print $1 }' <<<"$refs")
          got=$(git rev-parse HEAD)
          if [ -z "$want" ] || [ "$got" != "$want" ]; then
            echo "::error::checked out $got but tag $RELEASE_TAG points to ${want:-nothing}"
            exit 1
          fi
          echo "checked out $got = $RELEASE_TAG"
      - name: Download C library artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: c-lib-*
          path: c-artifacts/
          merge-multiple: true
      - name: bundle testvectors
        run: |
          tag="$RELEASE_TAG"
          tar -czf "ratify-testvectors-${tag}.tar.gz" testvectors/
          ls -lh ratify-testvectors-*.tar.gz
          ls -lh c-artifacts/ || true
      - name: compute install snippets for release notes
        # GitHub Release notes are static strings. Pre-compute the per-language
        # version forms here so the notes don't ask end users to run shell
        # substitutions like `$(node -p "...")` from a copy-paste.
        run: |
          tag="$RELEASE_TAG"          # v1.0.0-alpha.7
          tag_clean="${tag#v}"                     # 1.0.0-alpha.7
          py_version=$(echo "$tag_clean" | sed -E 's/-alpha\.([0-9]+)/a\1/; s/-beta\.([0-9]+)/b\1/; s/-rc\.([0-9]+)/rc\1/')
          # v2 uses the /v2 Go module path and the separate ratify-protocol-v2
          # Python distribution.
          # The summary, spec, and fixture lines are per release line. A v2
          # summary states only what the v2 corpus verifies at this tag.
          case "$tag" in
            v2.*)
              go_module="github.com/identities-ai/ratify-protocol/v2"; py_dist="ratify-protocol-v2"
              spec_file="SPEC-v2.md"; vectors_dir="testvectors/v2"
              summary="Protocol v2 prerelease. Not backward compatible with v1: v2 uses a separate key ID namespace, wire schemas, and strict dispatch, and v1 keys and proofs are never accepted as v2. At this tag the Go, TypeScript, Python, Rust, and C SDKs run every testvectors/v2 file, including the stateful verifier, lifecycle, and cross-SDK fixtures. Review so far is internal adversarial review; external independent review and outside interoperability are 2.0.0 gates, so this release carries no production security claim. See SPEC-v2.md section 8, docs/V2_REFERENCE_COMPATIBILITY.md, and the upgrade guide docs/PROTOCOL_V2_MIGRATION.md."
              ;;
            *)
              go_module="github.com/identities-ai/ratify-protocol";    py_dist="ratify-protocol"
              spec_file="SPEC.md"; vectors_dir="testvectors/v1"
              summary="Open cryptographic trust protocol for AI agent authorization. Hybrid Ed25519 + ML-DSA-65 (NIST FIPS 204) signatures; both must verify. Full canonical conformance fixture suite (see testvectors/v1), byte-for-byte interoperable across Go, TypeScript, Python, Rust, and C/C++."
              ;;
          esac
          {
            echo "TAG=$tag"
            echo "TAG_CLEAN=$tag_clean"
            echo "PY_VERSION=$py_version"
            echo "GO_MODULE=$go_module"
            echo "PY_DIST=$py_dist"
            echo "SPEC_FILE=$spec_file"
            echo "VECTORS_DIR=$vectors_dir"
            echo "SUMMARY=$summary"
          } >> "$GITHUB_ENV"
      - name: create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}   # required for workflow_dispatch (no tag in ref)
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, 'alpha') || contains(env.RELEASE_TAG, 'beta') || contains(env.RELEASE_TAG, 'rc') }}
          files: |
            ratify-testvectors-*.tar.gz
            c-artifacts/*
          body: |
            ## Ratify Protocol ${{ env.RELEASE_TAG }}

            ${{ env.SUMMARY }}

            ### Install

            ```bash
            # Go
            go get ${{ env.GO_MODULE }}@${{ env.TAG }}

            # Python
            pip install ${{ env.PY_DIST }}==${{ env.PY_VERSION }}

            # Rust
            cargo add ratify-protocol@${{ env.TAG_CLEAN }}

            # TypeScript
            npm install @identities-ai/ratify-protocol@${{ env.TAG_CLEAN }}

            # C/C++ — download pre-built archive above (no Rust required)
            # or build from source: cd sdks/c && cargo build --release
            ```

            ### Links

            - Full developer documentation: [docs.identities.ai](https://docs.identities.ai)
            - Normative specification: [${{ env.SPEC_FILE }}](https://github.com/identities-ai/ratify-protocol/blob/${{ env.TAG }}/${{ env.SPEC_FILE }})
            - Threat model: [docs/EXPLAINED.md](https://github.com/identities-ai/ratify-protocol/blob/main/docs/EXPLAINED.md)
            - Conformance fixtures: `${{ env.VECTORS_DIR }}`, bundled in `ratify-testvectors-${{ env.TAG }}.tar.gz` below

            ### Legal

            - **Trademark:** Ratify Protocol™ and identities.ai™ are trademarks of Identities.AI, Inc.
            - **Patent:** U.S. patent application pending.
            - **License:** Apache-2.0 (code) · CC-BY-4.0 (specification); see [docs/LICENSES.md](https://github.com/identities-ai/ratify-protocol/blob/main/docs/LICENSES.md).
