[package]
name = "ratify-python-rust-accelerator"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "ratify_rust_accel"
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
ratify-protocol = { path = "../../../sdks/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
