[package]
name = "ratify-node-rust-accelerator"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
napi = { version = "3", default-features = false, features = ["napi8", "async"] }
napi-derive = "3"
ratify-protocol = { path = "../../../sdks/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"
