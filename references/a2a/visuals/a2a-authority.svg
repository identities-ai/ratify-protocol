<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Receiver-verified authority in an A2A handoff</title>
  <desc id="desc">A principal signs a one-node grant. A calling agent carries it over A2A. The receiving agent issues a challenge and verifies the proof. One node is allowed; three nodes are denied before the protected action.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#10192b"/>
      <stop offset="1" stop-color="#1d2944"/>
    </linearGradient>
    <linearGradient id="receiver" x2="1" y2="1">
      <stop stop-color="#604180"/>
      <stop offset="1" stop-color="#392b67"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#070e1c" flood-opacity=".3"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="#9cb3d3" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#background)"/>
  <path d="M0 486 C300 394 658 564 1200 417" fill="none" stroke="#74a2ce" stroke-opacity=".08" stroke-width="2"/>
  <path d="M0 510 C340 419 716 586 1200 445" fill="none" stroke="#74a2ce" stroke-opacity=".08" stroke-width="2"/>
  <text x="56" y="66" fill="#e6eefc" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">Who authorized this exact handoff?</text>
  <text x="56" y="95" fill="#aebdd5" font-family="Inter,Arial,sans-serif" font-size="15">A2A carries the work. The receiving service decides whether it may act.</text>

  <g filter="url(#shadow)">
    <rect x="56" y="165" width="234" height="154" rx="17" fill="#263852" stroke="#6581a3"/>
    <rect x="322" y="165" width="234" height="154" rx="17" fill="#24445c" stroke="#5b9ab4"/>
    <rect x="588" y="165" width="268" height="154" rx="17" fill="url(#receiver)" stroke="#ad84da" stroke-width="2"/>
  </g>

  <circle cx="86" cy="194" r="15" fill="#aad0ef"/>
  <path d="M80 194 l4 4 l8 -9" fill="none" stroke="#18314a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="109" y="200" fill="#f4f7ff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Principal</text>
  <text x="80" y="239" fill="#d4e0f3" font-family="Inter,Arial,sans-serif" font-size="15">Signs one-node authority</text>
  <text x="80" y="264" fill="#9ec1e1" font-family="ui-monospace,monospace" font-size="13">us-central1 · max 1</text>

  <circle cx="352" cy="194" r="15" fill="#90d0d5"/>
  <path d="M345 194 h14 M352 187 v14" stroke="#17454d" stroke-width="2.5"/>
  <text x="375" y="200" fill="#f4f7ff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Calling agent</text>
  <text x="346" y="239" fill="#d4e0f3" font-family="Inter,Arial,sans-serif" font-size="15">Presents signed delegation</text>
  <text x="346" y="264" fill="#a5d7db" font-family="ui-monospace,monospace" font-size="13">A2A operation + proof</text>

  <circle cx="620" cy="194" r="15" fill="#ddbbff"/>
  <path d="M614 195 l4 4 l9 -10" fill="none" stroke="#4d2e69" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="643" y="200" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Receiving agent</text>
  <text x="612" y="239" fill="#eadcfb" font-family="Inter,Arial,sans-serif" font-size="15">Rebuilds the exact operation</text>
  <text x="612" y="264" fill="#cfb3ea" font-family="ui-monospace,monospace" font-size="13">fresh challenge · local trust</text>

  <path d="M291 240 H315" stroke="#9cb3d3" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M557 240 H581" stroke="#9cb3d3" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M857 218 H904 V169 H928" fill="none" stroke="#80d7a2" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M857 267 H904 V357 H928" fill="none" stroke="#f2a18e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="937" y="132" width="211" height="108" rx="14" fill="#1e473d" stroke="#69bb8b"/>
  <text x="960" y="170" fill="#bdf2d1" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">ALLOW</text>
  <text x="960" y="197" fill="#e5f8ea" font-family="Inter,Arial,sans-serif" font-size="14">1 node, inside grant</text>
  <text x="960" y="220" fill="#9bd5b0" font-family="ui-monospace,monospace" font-size="12">protected action runs</text>

  <rect x="937" y="312" width="211" height="108" rx="14" fill="#51313a" stroke="#dc8c7e"/>
  <text x="960" y="350" fill="#ffd2c8" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">DENY</text>
  <text x="960" y="377" fill="#f9e5de" font-family="Inter,Arial,sans-serif" font-size="14">3 nodes or wrong region</text>
  <text x="960" y="400" fill="#e9afa0" font-family="ui-monospace,monospace" font-size="12">action untouched</text>

  <text x="56" y="476" fill="#91a8c8" font-family="Inter,Arial,sans-serif" font-size="13">Independent draft · A2A carrier under discussion · no AGNTCY identity integration in this run</text>
</svg>
