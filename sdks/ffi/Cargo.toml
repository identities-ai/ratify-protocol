[package]
name = "ratify-protocol-ffi"
version = "2.0.0-beta.1"
edition = "2021"
license = "Apache-2.0"
description = "Internal FFI layer for the Ratify Protocol Swift and Kotlin SDKs. Not a public API."
repository = "https://github.com/identities-ai/ratify-protocol"
publish = false

[lib]
name = "ratify_protocol_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]
# Test-only: a one-shot panic injection point in every guarded export,
# armed by the C symbol `ratify_ffi_test_arm_panic`. Never in a shipped build.
test-hooks = ["ratify-protocol/test-hooks"]

[dependencies]
# Exact pin: this crate wraps one core version; release-sync checks it.
ratify-protocol = { path = "../rust", version = "=2.0.0-beta.1" }
uniffi = "=0.32.2"
thiserror = "2"
getrandom = "0.2"
zeroize = "1.8"
# The ML-DSA-65 half of an Android split-custody key, and the software half
# of a mixed rotation, both inside typed signing only (build plan §4.2).
fips204 = "0.4.6"
ed25519-dalek = "2.1"
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
ed25519-dalek = "2.1"
hex = "0.4"
sha2 = "0.10"
# Parses this crate's sources in tests/guarded.rs.
syn = { version = "2", features = ["full"] }
quote = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Unwind, not abort: UniFFI catches a panic at the boundary and reports it to
# the Swift or Kotlin caller as an internal error. With abort the host dies.
panic = "unwind"
strip = "symbols"
