[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Protocol v2 ships as its own distribution and import package
# (ratify_protocol_v2) so it installs alongside the v1 `ratify-protocol`
# package. It must never be published under the `ratify-protocol` name: an
# unbounded v1 requirement could then resolve to this incompatible line.
name = "ratify-protocol-v2"
version = "2.0.0b1"
description = "Ratify Protocol v2 Python SDK: delegated-authority proofs, installable alongside the v1 ratify-protocol package."
readme = "README.md"
authors = [{name = "Identities AI, Inc.", email = "hello@identities.ai"}]
maintainers = [{name = "Identities AI, Inc.", email = "hello@identities.ai"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
keywords = ["ratify", "delegation", "agent", "ed25519", "ml-dsa", "post-quantum", "authorization", "cryptography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=44.0",
    # IANA time zone data for the time_window constraint, pinned to the IANA
    # release 2025c that SPEC-v2 §5.2 evaluates against (tzdata 2025.3). The
    # SDK checks tzdata.IANA_VERSION at runtime and never reads host zoneinfo.
    "tzdata==2025.3",
    # Every key-generation and signing operation runs in this native
    # extension (constant-time Ed25519 and ML-DSA-65); there is no pure-Python
    # signing path. Version-locked to this release; the SDK rejects a
    # mismatched extension at import time.
    "ratify-protocol-native-v2==2.0.0b1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[project.urls]
Homepage = "https://ratifyprotocol.com"
Source = "https://github.com/identities-ai/ratify-protocol"
Issues = "https://github.com/identities-ai/ratify-protocol/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
