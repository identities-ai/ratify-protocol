[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ratify-protocol"
version = "1.0.0a20"
description = "Delegated-authority proofs for human-agent and agent-agent interactions — Python reference SDK for the Ratify Protocol."
readme = "README.md"
authors = [{name = "Identities AI, Inc.", email = "hello@identities.ai"}]
maintainers = [{name = "Identities AI, Inc.", email = "hello@identities.ai"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
keywords = ["ratify", "delegation", "agent", "ed25519", "ml-dsa", "post-quantum", "identity", "ai-agents", "authorization", "cryptography"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=44.0",
    # pqcrypto 1.0.0 (2026-08-15) changed ML-DSA-65 behaviour; every signature
    # fails against it. Bounded until the break is understood upstream.
    "pqcrypto>=0.3.4,<1.0",
    # The IANA time zone database, for the time_window constraint (SPEC 5.7).
    # zoneinfo reads the operating system's copy where there is one and falls
    # back to this package where there is not: Windows has no system database,
    # and minimal Linux containers often omit theirs.
    #
    # Declared unconditionally rather than behind a win32 marker. Without it a
    # verifier resolves no zone and denies every time_window constraint, so the
    # same proof bundle verifies on one machine and is rejected on another.
    # A protocol built on byte-identical cross-platform decisions cannot have
    # its verdict depend on which files the host happens to ship.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Deterministic seed-based key generation, which pqcrypto cannot provide. A
# separate distribution so this package stays pure-Python: install it only if
# you need the same seeds to yield the same identity across SDKs.
native = [
    "ratify-protocol-native==1.0.0a20",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://ratifyprotocol.com"
Documentation = "https://docs.identities.ai"
Source = "https://github.com/identities-ai/ratify-protocol"
Changelog = "https://github.com/identities-ai/ratify-protocol/blob/main/CHANGELOG.md"
Issues = "https://github.com/identities-ai/ratify-protocol/issues"
Security = "https://github.com/identities-ai/ratify-protocol/blob/main/SECURITY.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::pytest.PytestUnraisableExceptionWarning"]
