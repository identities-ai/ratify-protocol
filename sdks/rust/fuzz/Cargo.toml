[package]
name = "ratify-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ratify-protocol = { path = ".." }

# Separate workspace: the fuzz crate is never part of the main build.
[workspace]
members = ["."]

[profile.release]
debug = 1

# One target per v2 decoder. Each checks that decoding never panics and that
# a successful decode re-encodes to the exact input and decodes again to the
# same bytes.
#
# Still to add once the status subsystem port lands (decoders not in this
# crate yet):
#   - status evidence batch
#   - checkpoint acknowledgement
#   - security journal snapshot import
#   - archival result / archival evidence objects

[[bin]]
name = "delegation_cert_v2"
path = "fuzz_targets/delegation_cert_v2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proof_bundle_v2"
path = "fuzz_targets/proof_bundle_v2.rs"
test = false
doc = false
bench = false

